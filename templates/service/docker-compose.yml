# Desenvolvimento local: Postgres proprio. O servico roda fora do compose
# (`npm run start:dev`) e fala com os outros servicos por HTTP (ver .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: __DB_NAME__ }
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, timeout: 5s, retries: 10 }
volumes:
  pgdata:
