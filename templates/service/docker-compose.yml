# Desenvolvimento local: Postgres proprio + LocalStack (SNS/SQS) com a topologia
# da RFC-0006. O servico roda fora do compose (`npm run start:dev`).
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: __DB_NAME__ }
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, timeout: 5s, retries: 10 }
  localstack:
    image: localstack/localstack:3
    ports: ['4566:4566']
    environment: { SERVICES: 'sns,sqs,dynamodb', AWS_DEFAULT_REGION: us-east-1 }
    volumes:
      - ./node_modules/@guilhermeqmaia/oficina-kit/scripts/messaging-local.sh:/etc/localstack/init/ready.d/10-messaging.sh:ro
    healthcheck:
      { test: ['CMD', 'awslocal', 'sqs', 'list-queues'], interval: 5s, timeout: 5s, retries: 20 }
volumes:
  pgdata:
