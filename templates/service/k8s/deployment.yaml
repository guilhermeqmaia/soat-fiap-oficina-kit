apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SERVICE_NAME__
  labels:
    {
      app.kubernetes.io/name: __SERVICE_NAME__,
      app.kubernetes.io/part-of: oficina-mecanica,
      app.kubernetes.io/component: api,
    }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: __SERVICE_NAME__, app.kubernetes.io/component: api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {
          app.kubernetes.io/name: __SERVICE_NAME__,
          app.kubernetes.io/part-of: oficina-mecanica,
          app.kubernetes.io/component: api,
        }
      annotations:
        {
          prometheus.io/scrape: 'true',
          prometheus.io/port: '__PORT__',
          prometheus.io/path: '/metrics',
        }
    spec:
      securityContext:
        { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              { app.kubernetes.io/name: __SERVICE_NAME__, app.kubernetes.io/component: api }
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z "$DB_HOST" "$DB_PORT"; do sleep 2; done']
          env:
            - {
                name: DB_HOST,
                valueFrom: { secretKeyRef: { name: __SERVICE_NAME__-db, key: DB_HOST } },
              }
            - {
                name: DB_PORT,
                valueFrom: { secretKeyRef: { name: __SERVICE_NAME__-db, key: DB_PORT } },
              }
      containers:
        - name: app
          image: __SERVICE_NAME__:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: __PORT__ }]
          envFrom:
            - configMapRef: { name: __SERVICE_NAME__-config }
            - secretRef: { name: __SERVICE_NAME__-app }
          env:
            - {
                name: DATABASE_URL,
                valueFrom: { secretKeyRef: { name: __SERVICE_NAME__-db, key: DATABASE_URL } },
              }
            - { name: DD_AGENT_HOST, valueFrom: { fieldRef: { fieldPath: status.hostIP } } }
          startupProbe:
            { httpGet: { path: /health, port: http }, periodSeconds: 5, failureThreshold: 30 }
          livenessProbe:
            {
              httpGet: { path: /health, port: http },
              periodSeconds: 15,
              timeoutSeconds: 5,
              failureThreshold: 3,
            }
          readinessProbe:
            {
              httpGet: { path: /health/ready, port: http },
              periodSeconds: 10,
              timeoutSeconds: 5,
              failureThreshold: 3,
            }
          resources:
            requests: { cpu: '100m', memory: '256Mi' }
            limits: { cpu: '500m', memory: '512Mi' }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
