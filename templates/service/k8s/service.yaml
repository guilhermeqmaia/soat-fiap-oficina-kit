# ClusterIP na base. No EKS o overlay troca para NodePort: o NLB interno unico
# (stage gateway/ do infra-k8s, ADR-0013) tem um target group por servico.
apiVersion: v1
kind: Service
metadata:
  name: __SERVICE_NAME__
  labels:
    {
      app.kubernetes.io/name: __SERVICE_NAME__,
      app.kubernetes.io/part-of: oficina-mecanica,
      app.kubernetes.io/component: api,
    }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: __SERVICE_NAME__, app.kubernetes.io/component: api }
  ports: [{ name: http, protocol: TCP, port: __PORT__, targetPort: http }]
