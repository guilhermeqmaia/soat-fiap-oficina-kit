# `prisma migrate deploy` como passo explicito e auditavel (o CD espera concluir).
apiVersion: batch/v1
kind: Job
metadata:
  name: __SERVICE_NAME__-migrations
  labels: { app.kubernetes.io/name: __SERVICE_NAME__, app.kubernetes.io/component: migrations }
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: { app.kubernetes.io/name: __SERVICE_NAME__, app.kubernetes.io/component: migrations }
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: migrate
          image: __SERVICE_NAME__:latest
          imagePullPolicy: IfNotPresent
          command: ['npx', 'prisma', 'migrate', 'deploy']
          env:
            - {
                name: DATABASE_URL,
                valueFrom: { secretKeyRef: { name: __SERVICE_NAME__-db, key: DATABASE_URL } },
              }
          resources:
            requests: { cpu: '50m', memory: '128Mi' }
            limits: { cpu: '500m', memory: '256Mi' }
