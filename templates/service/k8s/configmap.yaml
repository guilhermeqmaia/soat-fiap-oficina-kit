# Variaveis NAO sensiveis. Segredos: Secret `__SERVICE_NAME__-app` (JWT_SECRET)
# e `__SERVICE_NAME__-db` (DATABASE_URL), ambos sincronizados pelo CD.
apiVersion: v1
kind: ConfigMap
metadata:
  name: __SERVICE_NAME__-config
  labels: { app.kubernetes.io/name: __SERVICE_NAME__, app.kubernetes.io/part-of: oficina-mecanica }
data:
  NODE_ENV: 'production'
  PORT: '__PORT__'
  JWT_ISSUER: 'oficina-auth-lambda'
  DB_SSL: 'true'
  # Rate limiting e da borda (API Gateway, ADR-0005); atras do NLB o IP de origem e unico.
  THROTTLER_DISABLED: 'true'
  AWS_REGION: 'us-east-1'
  # Preenchidos pelo CD a partir das vars SNS_TOPIC_ARN / SQS_QUEUE_URL (stage messaging/ do infra-k8s)
  SNS_TOPIC_ARN: '__SNS_TOPIC_ARN__'
  SQS_QUEUE_URL: '__SQS_QUEUE_URL__'
  DD_TRACE_ENABLED: 'true'
  DD_SERVICE: '__SERVICE_NAME__'
  DD_ENV: 'producao'
