apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Overlay EKS (ADR-0013): imagem do ECR, NodePort para o NLB interno unico, PDB.
namespace: oficina
resources:
  - ../k8s
  - pdb.yaml
patches:
  - path: patch-service-nodeport.yaml
  - path: patch-deployment.yaml
images:
  - name: __SERVICE_NAME__
    newName: __SERVICE_NAME__ # o CD faz `kustomize edit set image` com o ECR
    newTag: latest
