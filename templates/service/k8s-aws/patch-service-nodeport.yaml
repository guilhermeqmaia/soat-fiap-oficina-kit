# Um NLB interno para todos os servicos (Terraform, stage gateway/ do infra-k8s):
# cada servico expoe um NodePort fixo que vira um target group/listener la.
apiVersion: v1
kind: Service
metadata:
  name: __SERVICE_NAME__
spec:
  type: NodePort
  ports: [{ name: http, protocol: TCP, port: __PORT__, targetPort: http, nodePort: __NODE_PORT__ }]
