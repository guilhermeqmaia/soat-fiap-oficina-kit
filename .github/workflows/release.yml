name: Release (npm)

# Publica no npmjs.org quando uma tag `vX.Y.Z` e criada. A versao da tag
# precisa bater com a do package.json. Autenticacao por **Trusted Publishing**
# (OIDC do GitHub Actions -> npm), configurado na pagina do pacote; nenhum
# token. (A v0.1.0 foi publicada com NPM_TOKEN antes de o pacote existir.)

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      # Node 22: o npm com Trusted Publishing (>= 11.5) exige engine >= 22 e o
      # repo roda com engine-strict. O codigo continua compativel com Node 20
      # (CI e consumidores); so a publicacao usa 22.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag == package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"; PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }
      - run: npm run test:cov
      - run: npm run build
      - name: npm >= 11.5 (trusted publishing)
        run: npm install -g npm@11 && npm -v
      - name: Publish (OIDC)
        run: npm publish --provenance --access public
      - name: Resumo
        run: echo "### Publicado \`$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")\` em https://www.npmjs.com/package/@guilhermeqmaia/oficina-kit" >> "$GITHUB_STEP_SUMMARY"
