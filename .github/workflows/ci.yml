name: CI

# Roda em todo PR (check obrigatorio da branch protegida) e nos pushes da main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Formatacao (prettier)
        run: npm run format
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Testes unitarios + cobertura (gate 80% no jest.config.ts)
        run: npm run test:cov
      - name: Build + smoke de instalacao do tarball
        run: npm run pack:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
      - name: Auditoria de dependencias
        run: npm audit --omit=dev --audit-level=high

  template:
    name: Template de servico (gera, instala, testa e builda)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Empacotar o kit deste PR (o servico gerado testa ESTE codigo, nao o do registry)
        run: npm ci && npm run build && npm pack --pack-destination /tmp
      - name: Gerar servico a partir de templates/service
        run: scripts/new-service.sh exemplo /tmp/svc 3009 30099 "Servico de exemplo"
      - name: Instalar, gerar Prisma, lint, typecheck, unitarios (gate 80%) e build
        working-directory: /tmp/svc
        run: |
          cp /tmp/guilhermeqmaia-oficina-kit-*.tgz ./kit.tgz   # fica no contexto do docker build
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund ./kit.tgz
          npx prisma generate
          npm run format && npm run lint && npm run typecheck
          npm run test:unit:cov
          npm run build
      - name: e2e do servico gerado (testcontainers)
        working-directory: /tmp/svc
        run: npm run test:integration
      - name: docker build do servico gerado (com o kit do registry — o Dockerfile faz `npm ci` so com package*.json)
        working-directory: /tmp/svc
        run: |
          rm -f kit.tgz
          npm pkg set dependencies.@guilhermeqmaia/oficina-kit="^$(node -p "require('$GITHUB_WORKSPACE/package.json').version.replace(/\.\d+$/, '.0')")"
          npm install --no-audit --no-fund --package-lock-only
          docker build -t svc-exemplo:ci .

  sonarcloud:
    name: SonarCloud (quality gate)
    runs-on: ubuntu-latest
    needs: quality
    # So roda quando o SONAR_TOKEN existir (ADR-0011 / US-F4-13).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:cov
      - name: Analise
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Sem SONAR_TOKEN
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning::SONAR_TOKEN ausente — analise do SonarCloud pulada (US-F4-13)."
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
